</div>
<button class="absolute -bottom-2 -right-2 bg-primary text-on-primary p-2 rounded-full shadow-lg hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-sm" data-icon="edit">edit</span>
</button>
</div>
<div class="text-center md:text-left space-y-2">

<div class="inline-flex items-center gap-2 px-4 py-1.5 bg-primary-fixed text-on-primary-fixed rounded-full font-label font-bold text-xs uppercase tracking-widest">
<span class="material-symbols-outlined text-[14px]" data-icon="verified" style="font-variation-settings: 'FILL' 1;">verified</span>
            Elite Performance
          </div>
<p class="text-on-surface-variant font-medium">Active member since March 2023</p>
</div>
</div>
</section>
<div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
<!-- Left Column: Personal Info & Settings -->
<div class="lg:col-span-12 space-y-8">
<!-- Personal Information Card -->
<section class="bg-surface-container-low p-8 rounded-xl">
<div class="flex items-center justify-between mb-6">
<h2 class="font-headline font-bold text-xl text-on-surface">Personal Information</h2>
<button class="text-primary font-bold text-sm hover:underline" id="editPersonalBtn">Edit</button>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div class="space-y-2">

<div class="bg-surface-container-highest px-4 py-3 rounded-lg text-on-surface font-medium" data-profile-field="name">Alex Rivers</div>
</div>
<div class="space-y-2">
<label class="font-label font-bold text-xs uppercase text-on-surface-variant tracking-wider ml-1">Email Address</label>
<div class="bg-surface-container-highest px-4 py-3 rounded-lg text-on-surface font-medium break-all leading-tight" data-profile-field="email">alex.rivers@fitvit.edu</div>
</div>
<div class="space-y-2">
<label class="font-label font-bold text-xs uppercase text-on-surface-variant tracking-wider ml-1">Age</label>
<div class="bg-surface-container-highest px-4 py-3 rounded-lg text-on-surface font-medium" data-profile-field="age">24 years</div>
</div>

</div>

<div class="bg-surface-container-highest px-4 py-3 rounded-lg text-on-surface font-medium" data-profile-field="height">182 cm</div>
</div>
</div>
</div>
</section>
<!-- Settings & Preferences -->
<section class="bg-surface-container-low p-8 rounded-xl">
<h2 class="font-headline font-bold text-xl text-on-surface mb-6">Preferences &amp; Security</h2>
<div class="space-y-6">
<div class="space-y-3">
<p class="text-sm font-bold text-on-surface">Preferred Mess</p>
<p class="text-sm text-on-surface-variant">Meal Planner will open with this mess type by default.</p>
<div class="bg-surface-container-high p-1.5 rounded-full flex gap-1 self-start w-fit" id="preferredMessSelector">
<button class="px-5 py-2 rounded-full font-bold transition-all text-zinc-500 hover:text-primary" data-preferred-mess="Veg" type="button">Veg</button>
<button class="px-5 py-2 rounded-full font-bold transition-all text-zinc-500 hover:text-primary" data-preferred-mess="Non-Veg" type="button">Non-Veg</button>
<button class="px-5 py-2 rounded-full font-bold transition-all text-zinc-500 hover:text-primary" data-preferred-mess="Special" type="button">Special</button>
</div>
</div>
<button class="w-full md:w-auto inline-flex items-center justify-center gap-2 px-6 py-3 rounded-full bg-[#ef4444] text-white font-headline font-bold hover:opacity-90 active:scale-95 transition-all" id="signOutBtn" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="logout">logout</span>
            Sign Out
          </button>

</div>
</div>
<!-- Sticky Bottom CTA -->
<div class="fixed bottom-28 left-0 w-full px-6 flex justify-center pointer-events-none">
<button class="pointer-events-auto primary-gradient text-on-primary font-headline font-bold px-12 py-4 rounded-full shadow-xl shadow-primary/20 flex items-center gap-3 active:scale-95 transition-all" id="saveChangesBtn">
<span class="material-symbols-outlined" data-icon="save">save</span>
        Save Changes
      </button>
</div>
</main>
<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-client.js"></script>
<script>
  (() => {
    const currentUser = JSON.parse(localStorage.getItem("fitvit_user") || "{}");
    const uid = currentUser.uid || "guest";
    const profileMap = JSON.parse(localStorage.getItem("fitvit_user_profiles") || "{}");
    const defaults = {
      name: currentUser.name || "User",
      email: uid === "guest" ? "" : uid,
      age: "",
      weight: "",
      height: ""
    };

    let profile = {
      ...defaults,
      ...(profileMap[uid] || {})
    };
    let isEditing = false;

    const headerName = document.getElementById("profileHeaderName");
    const brandHomeBtn = document.getElementById("brandHomeBtn");
    const editBtn = document.getElementById("editPersonalBtn");
    const saveBtn = document.getElementById("saveChangesBtn");
    const signOutBtn = document.getElementById("signOutBtn");
    const preferredMessButtons = Array.from(document.querySelectorAll("[data-preferred-mess]"));

    const allowedMessTypes = ["Veg", "Non-Veg", "Special"];
    let preferredMess = localStorage.getItem("fitvit_preferred_mess") || "Non-Veg";
    if (!allowedMessTypes.includes(preferredMess)) {
      preferredMess = "Non-Veg";
    }

    const fieldFormat = {
      name: (v) => v,
      email: (v) => v,
      age: (v) => `${v} years`,
      weight: (v) => `${v} kg`,
      height: (v) => `${v} cm`
    };

    function renderProfile() {
      if (headerName) headerName.textContent = profile.name || defaults.name;
      document.querySelectorAll("[data-profile-field]").forEach((node) => {
        const key = node.getAttribute("data-profile-field");
        const value = profile[key] || defaults[key] || "";
        node.textContent = fieldFormat[key] ? fieldFormat[key](value) : value;
      });
    }

    function enableEditMode() {
      isEditing = true;
      document.querySelectorAll("[data-profile-field]").forEach((node) => {
        const key = node.getAttribute("data-profile-field");
        const value = profile[key] || defaults[key] || "";
        node.innerHTML = `<input data-edit-input="${key}" value="${value}" class="w-full bg-white rounded-lg px-3 py-2 border border-outline-variant/40" />`;
      });
    }

    function collectEdits() {
      document.querySelectorAll("[data-edit-input]").forEach((input) => {
        const key = input.getAttribute("data-edit-input");
        profile[key] = input.value.trim();
      });
      profileMap[uid] = profile;
      localStorage.setItem("fitvit_user_profiles", JSON.stringify(profileMap));

      localStorage.setItem(
        "fitvit_user",
        JSON.stringify({
          ...currentUser,
          uid,
          name: profile.name || currentUser.name || defaults.name
        })
      );

      isEditing = false;
      renderProfile();
    }

    async function hydrateProfileFromSupabase() {
      if (!window.FitVitSupabase?.isConfigured() || uid === "guest") {
        return;
      }

      try {
        const { data, error } = await window.FitVitSupabase.getProfile(uid);
        if (error || !data) {
          return;
        }

        profile = {
          ...profile,
          name: data.name || profile.name || defaults.name,
          email: data.email || profile.email || defaults.email,
          age: data.age ?? profile.age ?? "",
          weight: data.weight ?? profile.weight ?? "",
          height: data.height ?? profile.height ?? ""
        };

        if (data.preferred_mess && allowedMessTypes.includes(data.preferred_mess)) {
          preferredMess = data.preferred_mess;
          localStorage.setItem("fitvit_preferred_mess", preferredMess);
        }

        profileMap[uid] = profile;
        localStorage.setItem("fitvit_user_profiles", JSON.stringify(profileMap));
        localStorage.setItem(
          "fitvit_user",
          JSON.stringify({
            ...currentUser,
            uid,
            name: profile.name || currentUser.name || defaults.name
          })
        );

        renderProfile();
        renderPreferredMessSelection();
      } catch (error) {
        console.warn("Supabase profile load failed; using local profile.", error);
      }
    }

    async function clearFitvitSession() {
      try {
        if (window.FitVitSupabase?.isConfigured()) {
          await window.FitVitSupabase.signOutAuth();
        }
      } catch (error) {
        console.warn("Supabase sign out failed.", error);
      }

      const preservedKeys = new Set(["fitvit_accounts", "fitvit_dummy_account", "fitvit_supabase_url", "fitvit_supabase_anon_key"]);
      const localKeys = Object.keys(localStorage).filter(
        (key) => key.startsWith("fitvit_") && !preservedKeys.has(key)
      );
      localKeys.forEach((key) => localStorage.removeItem(key));

      const sessionKeys = Object.keys(sessionStorage).filter((key) => key.startsWith("fitvit_"));
      sessionKeys.forEach((key) => sessionStorage.removeItem(key));
    }

    function renderPreferredMessSelection() {
      preferredMessButtons.forEach((button) => {
        const isActive = button.dataset.preferredMess === preferredMess;
        button.classList.toggle("bg-surface-container-lowest", isActive);
        button.classList.toggle("text-primary", isActive);
        button.classList.toggle("shadow-sm", isActive);
        button.classList.toggle("text-zinc-500", !isActive);
      });
    }

    renderProfile();
    renderPreferredMessSelection();
    hydrateProfileFromSupabase();

    if (editBtn) {
      editBtn.addEventListener("click", () => {
        enableEditMode();
      });
    }

    if (brandHomeBtn) {
      brandHomeBtn.addEventListener("click", () => {
        window.location.href = "/flow/02-performance-dashboard.html";
      });
    }

    if (saveBtn) {
      saveBtn.addEventListener("click", async () => {
        if (isEditing) {
          collectEdits();
        }

        try {
          if (window.FitVitSupabase?.isConfigured()) {
            const result = await window.FitVitSupabase.upsertProfile(uid, {
              ...profile,
              email: profile.email || uid,
              preferredMess
            });
            if (result?.error) {
              throw result.error;
            }
          }
        } catch (error) {
          console.error("Supabase profile save failed; continuing with local profile.", error);
          alert("Supabase profile save failed: " + (error?.message || "Unknown error"));
        }

        const lastPage = sessionStorage.getItem("fitvit_last_page") || "";
        const safeReturn =
          !lastPage ||
          lastPage.includes("/flow/07-profile-settings") ||
          lastPage.includes("/stitch/")
            ? "/flow/02-performance-dashboard.html"
            : lastPage;

        window.location.href = safeReturn;
      });
    }

    preferredMessButtons.forEach((button) => {
      button.addEventListener("click", () => {
        const selected = button.dataset.preferredMess;
        if (!allowedMessTypes.includes(selected)) {
          return;
        }
        preferredMess = selected;
        localStorage.setItem("fitvit_preferred_mess", preferredMess);
        renderPreferredMessSelection();
      });
    });

    if (signOutBtn) {
      signOutBtn.addEventListener("click", async () => {
        await clearFitvitSession();
        window.location.href = "/stitch/stitch_smart_mess_dashboard%20(10)/code.html";
      });
    }
  })();
</script>
</body></html>
